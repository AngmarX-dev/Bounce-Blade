<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080d19">
<title>Bounce Blade — Original Browser Edition</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d19;color:#f4f7ff;font-family:system-ui,Segoe UI,sans-serif}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#14243a,#060a12)}
main{width:min(100vw,calc(100vh * 1.7778));height:min(100vh,calc(100vw * .5625));position:relative}
canvas{width:100%;height:100%;display:block;touch-action:none;border:1px solid #23384d;border-radius:12px;box-shadow:0 0 48px #00e8d022}
.hint{position:absolute;bottom:8px;left:0;right:0;text-align:center;color:#8ea4bd;font-size:11px;pointer-events:none}
@media(max-width:600px){main{width:100vw;height:56.25vw;max-height:100vh}.hint{font-size:9px}}
</style>
</head>
<body>
<main>
<canvas id="game" aria-label="Bounce Blade original game canvas"></canvas>
<div class="hint">ORIGINAL CAMPAIGN · DRAG TO MOVE THE WALL SHIELD · HOLD A SECOND TOUCH TO SLOW TIME · ESC TO PAUSE</div>
</main>
<script src="assets/levels-data.js"></script>
<script src="web.js"></script>
</body>
</html>
