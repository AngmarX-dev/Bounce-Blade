name: Compose Arcade APK

on:
  push:
    branches: ["feature/compose-arcade-alt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build and publish standalone Compose APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out Compose Arcade branch
        uses: actions/checkout@v4
        with:
          ref: feature/compose-arcade-alt

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run tests and build APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify standalone APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          with apk.open("rb") as stream:
              if stream.read(4) != bytes((0x50, 0x4b, 0x03, 0x04)):
                  raise SystemExit("Invalid APK package header")
          print(f"APK ready: {apk.stat().st_size} bytes")
          PY

      - name: Move Compose APK tag to this build
        run: |
          git tag --force compose-arcade-latest "$GITHUB_SHA"
          git push --force origin refs/tags/compose-arcade-latest

      - name: Publish direct APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: compose-arcade-latest
          name: Bounce Blade - Compose Arcade APK
          body: |
            Standalone debug APK built from feature/compose-arcade-alt.
            Download app-debug.apk directly and install it on your Android device.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
