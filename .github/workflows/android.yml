name: Bounce Blade Kotlin APK
on:
  push:
    branches: ["feature/kotlin-native-from-html", "feature/kotlin-surfaceview-from-spec"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Test and build standalone Kotlin APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify isolated Kotlin project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          required = ["settings.gradle.kts", "build.gradle.kts", "gradle.properties",
            "app/build.gradle.kts", "app/src/main/AndroidManifest.xml",
            "app/src/main/java/com/angmarx/bounceblade/MainActivity.kt",
            "app/src/test/java/com/angmarx/bounceblade/GameRulesTest.kt"]
          missing = [p for p in required if not Path(p).is_file()]
          if missing: sys.exit("Missing project files: " + ", ".join(missing))
          if Path("index.html").exists() or Path("Images").exists() or Path("SoundTrack").exists():
            sys.exit("This branch must contain the native game only, not HTML or unrelated assets.")
          source = Path("app/src/main/java/com/angmarx/bounceblade/MainActivity.kt").read_text()
          for marker in ["class MainActivity : Activity()", "private fun start(n:Int)", "private fun catchBlade()", "private fun drawStages(c:Canvas)", "private fun drawHow(c:Canvas)"]:
            if marker not in source: sys.exit("Missing gameplay implementation: " + marker)
          PY
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run unit tests and build APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BounceBlade-Kotlin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bounce-blade-surfaceview-v1
          name: Bounce Blade Kotlin SurfaceView APK v1
          body: Native Kotlin Android edition based on the supplied SurfaceView/Canvas approach. Features landscape fullscreen play, a dedicated render loop, 50 campaign stages, touch shield controls, hazards, power-ups, save progression, and synthesized retro sound effects. Install `app-debug.apk` on Android 7.0+.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
