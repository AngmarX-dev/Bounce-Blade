name: Android CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Verify image, icon, and soundtrack assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          required = [
              "Images/App Icon & Logo/App Icon.png",
              "Images/App Icon & Logo/Game Logo.png",
              "Images/Backgrounds & Environments/Gameplay Background.png",
              "Images/Backgrounds & Environments/Menu Background.png",
              "Images/Backgrounds & Environments/Victory Background.png",
              "Images/Backgrounds & Environments/Game Over Background.png",
              "Images/Gameplay Sprites/Blade.png",
              "Images/Gameplay Sprites/Enemy Drone.png",
              "Images/Gameplay Sprites/Enemy Slime.png",
              "Images/Gameplay Sprites/Enemy Turret.png",
              "Images/Gameplay Sprites/Portal.png",
              "Images/UI Elements/Button.png",
              "SoundTrack/Music & Ambience/Main Menu Theme.wav",
              "SoundTrack/Music & Ambience/Gameplay Background.wav",
              "SoundTrack/Music & Ambience/Victory Theme.wav",
              "SoundTrack/Music & Ambience/Game Over Theme.wav",
              "SoundTrack/Core Gameplay SFX/Blade Launch.wav",
              "SoundTrack/Core Gameplay SFX/Level Complete.wav",
              "SoundTrack/Core Gameplay SFX/Level Fail - Death.wav",
              "SoundTrack/UI & Feedback SFX/Button Click.wav",
              "SoundTrack/Optional - Extra Sounds/Power-Up Collect.wav",
          ]
          missing = [path for path in required if not Path(path).is_file() or Path(path).stat().st_size == 0]
          if missing:
              sys.exit("Missing required game assets: " + ", ".join(missing))
          print(f"Verified {len(required)} artwork/audio files.")
          PY


      - name: Verify landscape orientation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          manifest = Path("app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          activity = Path("app/src/main/java/com/angmarx/bounceblade/MainActivity.kt").read_text(encoding="utf-8")
          if 'android:screenOrientation="landscape"' not in manifest:
              sys.exit("AndroidManifest must declare landscape orientation.")
          if "SCREEN_ORIENTATION_LANDSCAPE" not in activity:
              sys.exit("MainActivity must request landscape orientation.")
          print("Verified landscape orientation in the manifest and Activity.")
          PY

      - name: Verify left-wall guard gameplay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          source = Path("app/src/main/java/com/angmarx/bounceblade/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              "simulateWallGuardStep",
              "launchWallGuardBlade",
              "drawWallGuardGame",
              "guardPaddleY = clampGuardPaddleY(ny)",
              "THE BLADE PASSED THE LEFT WALL",
          ]
          missing = [marker for marker in required if marker not in source]
          if missing:
              sys.exit("Missing wall-guard gameplay wiring: " + ", ".join(missing))
          print("Verified automatic blade launch, movable shield, arcade renderer, and fail condition.")
          PY

      - name: Validate campaign level JSON
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          folder = pathlib.Path("app/src/main/assets/levels")
          files = sorted(folder.glob("level_[0-9][0-9][0-9].json"))
          if len(files) < 100:
              sys.exit(f"Expected at least 100 level files, found {len(files)}")
          required = {"id", "name", "world", "maxBounces", "playerSpawn", "exit", "switch", "enemies", "crates", "hazards", "requiresAllTargets", "requiresSwitch"}
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              expected_id = int(path.stem[-3:])
              missing = required - data.keys()
              if missing:
                  sys.exit(f"{path}: missing keys {sorted(missing)}")
              if data["id"] != expected_id:
                  sys.exit(f"{path}: id {data['id']} does not match filename id {expected_id}")
              if data["requiresAllTargets"] and (not data["enemies"] or not data["crates"]):
                  sys.exit(f"{path}: target-required levels need enemies and crates")
              if not isinstance(data["maxBounces"], int) or data["maxBounces"] < 1:
                  sys.exit(f"{path}: maxBounces must be a positive integer")
              for point_name in ("playerSpawn", "exit", "switch"):
                  point = data[point_name]
                  if not all(key in point and 0 <= float(point[key]) <= 1 for key in ("x", "y")):
                      sys.exit(f"{path}: {point_name} must use normalized x/y coordinates")
              supported_hazards = {"spikes", "laser", "moving_hazard", "sticky_wall", "teleporter", "power_up", "moving_spikes", "rotating_laser", "gravity_well", "conveyor_belt", "breakable_wall", "switch", "key", "door"}
              for hazard in data["hazards"]:
                  if hazard.get("type") not in supported_hazards:
                      sys.exit(f"{path}: unsupported hazard type {hazard.get('type')!r}")
                  if not all(key in hazard and 0 <= float(hazard[key]) <= 1
                             for key in ("x", "y", "width", "height")):
                      sys.exit(f"{path}: hazard data must use normalized coordinates/sizes")
          if len(files) != 100:
              sys.exit(f"Expected exactly 100 campaign levels, found {len(files)}")
          worlds = ["Neon Grid", "Crimson Circuit", "Azure Vault", "Magenta Maze", "Golden Core", "Obsidian Rift", "Solar Flare", "Quantum Abyss", "Storm Citadel", "Celestial Forge"]
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              expected_world = worlds[(data["id"] - 1) // 10]
              if data["world"] != expected_world:
                  sys.exit(f"{path}: expected world {expected_world!r}, found {data['world']!r}")
              if any(h.get("type") == "teleporter" for h in data["hazards"]) and sum(h.get("type") == "teleporter" for h in data["hazards"]) < 2:
                  sys.exit(f"{path}: a teleporter level must have a pair")
          print(f"Validated {len(files)} levels across five worlds.")
          PY

      - name: Verify hostile enemy behavior and turret durability
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          source = Path("app/src/main/java/com/angmarx/bounceblade/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              "private fun updateHostileEnemies(dt: Float)",
              "val droneSpeed =",
              "enemy.jumpTime = 0.58f",
              "id in 21..30 || id >= 41 -> 3",
              "DRONE HIT THE WALL — YOU BURNED",
              "val isTurret = enemy.kind == 1 || enemy.kind == 3 || enemy.kind == 7 || enemy.kind == 8 || enemy.kind == 9",
          ]
          missing = [marker for marker in required if marker not in source]
          if missing:
              sys.exit("Missing hostile enemy behavior: " + ", ".join(missing))
          extra_required = [
              "private fun enemyKindForCampaignLevel(id: Int, index: Int): Int",
              "4 -> {",
              "5 -> {",
              "6 -> {",
              "1, 3, 7, 8, 9 -> {",
              "HEALER RESTORED AN ENEMY",
              "EXPLOSIVE BREACHED THE WALL",
          ]
          missing_extra = [marker for marker in extra_required if marker not in source]
          if missing_extra:
              sys.exit("Missing expanded enemy variants: " + ", ".join(missing_extra))
          print("Verified drone pursuit/breach, healer, explosive, teleporter, sniper, armored and boss behaviors.")
          PY

      - name: Verify per-enemy health bars and piercing blade damage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          source = Path("app/src/main/java/com/angmarx/bounceblade/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              "var maxHealth: Int = health, var bladeHitCooldown: Float = 0f",
              "enemy.bladeHitCooldown = (enemy.bladeHitCooldown - rawDt).coerceAtLeast(0f)",
              "private fun drawEnemyHealthBar(canvas: Canvas, enemy: EnemyState, x: Float, y: Float, drawSize: Float)",
              "drawEnemyHealthBar(canvas, enemy, x, y, drawSize)",
              "val healthRatio = (enemy.health.toFloat() / maxHealth).coerceIn(0f, 1f)",
              "val fillColor = when {",
              "enemy.bladeHitCooldown = 0.32f",
              "val piercingBoost = (activeEffects[\"piercing\"] ?: 0f) > 0f",
              "enemy.health -= if (piercingBoost) 2 else 1",
              "val passDistance = hitRadius + minDim * 0.008f",
              "px = ex + (velocityX / adjustedSpeed) * passDistance",
              "py = ey + (velocityY / adjustedSpeed) * passDistance",
              "ENEMY DAMAGED",
          ]
          missing = [marker for marker in required if marker not in source]
          if missing:
              sys.exit("Missing enemy health/pass-through behavior: " + ", ".join(missing))

          sim_start = source.index("    private fun simulateStep(dt: Float) {")
          arcade_start = source.index("    /**\n     * Arcade mode:", sim_start)
          normal = source[sim_start:arcade_start]
          hit_start = normal.index("        val pendingSlimes = mutableListOf<EnemyState>()")
          hit_end = normal.index("        enemies.addAll(pendingSlimes)", hit_start)
          normal_enemy_hits = normal[hit_start:hit_end]
          if "reflectFrom(dx, dy)" in normal_enemy_hits or "useBounce()" in normal_enemy_hits:
              sys.exit("Normal-mode enemy hits must pierce without reflecting or spending a bounce.")

          wall_start = source.index("    private fun simulateWallGuardStep(dt: Float) {")
          wall_after = source.index("\n    private fun ", wall_start + 20)
          wall_guard = source[wall_start:wall_after]
          if "if (!enemy.alive || enemy.bladeHitCooldown > 0f) continue" not in wall_guard:
              sys.exit("Wall-guard enemy hits must honor the per-enemy damage cooldown.")
          if "reflectFrom(" in wall_guard[wall_guard.index("val pendingSpawns"):wall_guard.index("enemies.addAll(pendingSpawns)")]:
              sys.exit("Wall-guard ordinary enemy hits must not reflect the blade.")
          print("Verified health bars for all enemies, per-enemy damage cooldowns, and pass-through hits.")
          PY

      - name: Verify blade shop, coin rewards, and purchased powers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          source = Path("app/src/main/java/com/angmarx/bounceblade/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              "private fun drawShop(canvas: Canvas)",
              "private fun purchaseShopItem(index: Int)",
              "private fun activateNovaPulse()",
              "private fun drawNovaFlash(canvas: Canvas)",
              "val baseCoinReward = 80 + levelId * 8 + earnedStars * 30",
              "private fun bladeSpeedScale(): Float",
              "private fun coinBalance(): Int",
              "NOVA READY",
              "BLADE SHOP",
              "val droneSpeed = (0.022f + min(levelId, 20) * 0.00045f)",
              "private fun guardPaddleHalf(): Float = viewH * when (difficulty)",
          ]
          missing = [marker for marker in required if marker not in source]
          if missing:
              sys.exit("Missing shop/power/economy wiring: " + ", ".join(missing))
          print("Verified shop economy, persistent upgrades, Nova Pulse, larger buttons, and slower drones.")
          PY

      - name: Verify large and tappable game buttons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          source = Path("app/src/main/java/com/angmarx/bounceblade/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              "val hitRect = RectF(left * viewW, top * viewH, right * viewW, bottom * viewH)",
              "val visualRect = buttonBitmap?.let { fitAssetRect(it, hitRect) } ?: hitRect",
              "drawAsset(canvas, \"UI Elements/Button.png\", hitRect, if (enabled) 255 else 125)",
              "availableTextWidth",
              "maxWidth: Float = 0f",
              "if (label.length > 18) 0.036f else 0.042f",
              "drawButton(canvas, 0.825f, 0.027f, 0.97f, 0.110f, \"Ⅱ\", pink)",
              "val novaLeft = if (oneHandedMode)",
              "val novaTop = if (oneHandedMode)",
              "if (leftHandedMode) drawButton(canvas, novaLeft, novaTop, novaRight, novaBottom, novaLabel, gold, true)",
              "else drawButton(canvas, novaLeftRight, novaTop, novaRightRight, novaBottom, novaLabel, gold, true)",
              "val abilityHit = if (oneHandedMode)",
              "inRect(nx, ny, 0.82f, 0.025f, 0.98f, 0.115f)",
              "inRect(nx, ny, 0.775f, 0.790f, 0.98f, 0.935f)",
              "0.10f, 0.432f, 0.90f, 0.492f",
              "private fun inRect(x: Float, y: Float, left: Float, top: Float, right: Float, bottom: Float): Boolean {",
          ]
          missing = [marker for marker in required if marker not in source]
          if missing:
              sys.exit("Missing larger button or matching hitbox wiring: " + ", ".join(missing))
          print("Verified larger button artwork, type, and matching touch zones.")
          PY

      - name: Verify in-game story chapters and navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          source = Path("app/src/main/java/com/angmarx/bounceblade/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              "GameScreen.STORY -> drawStory(canvas)",
              'drawButton(canvas, 0.10f, 0.747f, 0.90f, 0.807f, "THE STORY", cyan)',
              "private fun drawStory(canvas: Canvas)",
              "Lumen Grid",
              "Golden Core",
              "The Guardians created the Bounce Blade",
              "NEXT CHAPTER",
              "storyPage++",
              "GameScreen.FEATURES, GameScreen.STORY -> GameScreen.MENU",
          ]
          missing = [marker for marker in required if marker not in source]
          if missing:
              sys.exit("Missing in-game story feature: " + ", ".join(missing))
          print("Verified story menu entry, three narrative chapters, and navigation.")
          PY

      - name: Verify replacement artwork and safe layout bounds
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          required = [
              "Images/App Icon & Logo/Splash Screen.png",
              "Images/Backgrounds & Environments/Game Over Background.png",
              "Images/Backgrounds & Environments/Gameplay Background.png",
              "Images/Backgrounds & Environments/Menu Background.png",
              "Images/Backgrounds & Environments/Victory Background.png",
              "Images/Banners & Text/Game Over Banner.png",
              "Images/Banners & Text/Level Complete Banner.png",
              "Images/Banners & Text/Victory Banner.png",
              "Images/Effects & Particles/Impact Spark.png",
              "Images/Effects & Particles/Portal Enter Effect.png",
              "Images/Effects & Particles/Slice Effect.png",
              "Images/Gameplay Sprites/Floor Tile.jpg",
              "Images/Gameplay Sprites/Switch.jpg",
              "Images/Gameplay Sprites/Wall Segment.jpg",
              "Images/World Art/Neon Grid.png",
              "Images/World Art/Crimson Circuit.png",
              "Images/World Art/Azure Vault.png",
              "Images/World Art/Magenta Maze.png",
              "Images/World Art/Golden Core.png",
          ]
          missing = [path for path in required if not Path(path).is_file() or Path(path).stat().st_size == 0]
          if missing:
              sys.exit("Missing replacement artwork: " + ", ".join(missing))
          if Path("New Image").exists():
              sys.exit("Temporary New Image directory should be removed after migration.")
          legacy = [
              "Images/UI Elements/Button.jpeg",
              "Images/Gameplay Sprites/Floor Tile.png",
              "Images/Gameplay Sprites/Switch.png",
              "Images/Gameplay Sprites/Wall Segment.png",
          ]
          present = [path for path in legacy if Path(path).exists()]
          if present:
              sys.exit("Legacy artwork still present: " + ", ".join(present))

          source = Path("app/src/main/java/com/angmarx/bounceblade/MainActivity.kt").read_text(encoding="utf-8")
          required_wiring = [
              "World Art/Neon Grid.png",
              "World Art/Crimson Circuit.png",
              "World Art/Azure Vault.png",
              "World Art/Magenta Maze.png",
              "World Art/Golden Core.png",
              "availableTextWidth",
              "val top = 0.225f + row * 0.126f",
              "inRect(nx, ny, left, top, left + 0.44f, top + 0.105f)",
              "Gameplay Sprites/Switch.jpg",
              "Effects & Particles/Impact Spark.png",
          ]
          missing_wiring = [marker for marker in required_wiring if marker not in source]
          if missing_wiring:
              sys.exit("Missing new-art or safe-layout integration: " + ", ".join(missing_wiring))
          print(f"Verified {len(required)} replacement images, legacy cleanup, world artwork, and bounded UI layout.")
          PY

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Verify transparent-padding trimming is enabled
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          source = Path("app/src/main/java/com/angmarx/bounceblade/MainActivity.kt").read_text(encoding="utf-8")
          required = [
              "private fun trimTransparentPadding(source: Bitmap)",
              "source.getPixels(pixels, 0, width, 0, 0, width, height)",
              "if (alpha > 12)",
              "Bitmap.createBitmap(source, left, top, right - left, bottom - top)",
              "val bitmap = trimTransparentPadding(decoded)",
          ]
          missing = [marker for marker in required if marker not in source]
          if missing:
              sys.exit("Missing transparent-padding trimming implementation: " + ", ".join(missing))
          print("Verified image-load trimming removes transparent borders while preserving source PNGs.")
          PY

      - name: Verify standalone APK output
        if: success()
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          file app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          from pathlib import Path
          apk = Path("app/build/outputs/apk/debug/app-debug.apk")
          with apk.open("rb") as stream:
              if stream.read(4) != bytes((0x50, 0x4b, 0x03, 0x04)):
                  raise SystemExit("APK does not have a valid ZIP-based Android package header.")
          print(f"Verified standalone APK: {apk.name} ({apk.stat().st_size} bytes).")
          PY

      # Actions artifacts are downloaded as ZIP archives. Publish the APK as a
      # Release asset instead so Android can download app-debug.apk directly.
      - name: Move latest debug tag to this build
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git tag --force latest-debug "$GITHUB_SHA"
          git push --force origin refs/tags/latest-debug

      - name: Publish standalone APK download
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Bounce Blade - Latest Debug APK
          body: |
            Latest successful debug build of Bounce Blade.
            Download app-debug.apk directly; it is not wrapped in a ZIP archive.
          prerelease: true
          make_latest: false
          overwrite_files: true
          files: app/build/outputs/apk/debug/app-debug.apk
