name: Android CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate campaign level JSON
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import sys

          folder = pathlib.Path("app/src/main/assets/levels")
          files = sorted(folder.glob("level_[0-9][0-9][0-9].json"))
          if len(files) < 20:
              sys.exit(f"Expected at least 20 level files, found {len(files)}")
          required = {"id", "name", "maxBounces", "playerSpawn", "exit", "switch", "enemies", "crates", "hazards"}
          for path in files:
              data = json.loads(path.read_text(encoding="utf-8"))
              expected_id = int(path.stem[-3:])
              missing = required - data.keys()
              if missing:
                  sys.exit(f"{path}: missing keys {sorted(missing)}")
              if data["id"] != expected_id:
                  sys.exit(f"{path}: id {data['id']} does not match filename id {expected_id}")
              if not data["enemies"] or not data["crates"]:
                  sys.exit(f"{path}: each starter stage must contain enemies and crates")
              if not isinstance(data["maxBounces"], int) or data["maxBounces"] < 1:
                  sys.exit(f"{path}: maxBounces must be a positive integer")
              for point_name in ("playerSpawn", "exit", "switch"):
                  point = data[point_name]
                  if not all(key in point and 0 <= float(point[key]) <= 1 for key in ("x", "y")):
                      sys.exit(f"{path}: {point_name} must use normalized x/y coordinates")
              supported_hazards = {"spikes", "laser", "moving_hazard"}
              for hazard in data["hazards"]:
                  if hazard.get("type") not in supported_hazards:
                      sys.exit(f"{path}: unsupported hazard type {hazard.get('type')!r}")
                  if not all(key in hazard and 0 <= float(hazard[key]) <= 1
                             for key in ("x", "y", "width", "height")):
                      sys.exit(f"{path}: hazard data must use normalized coordinates/sizes")
          print(f"Validated {len(files)} campaign level files.")
          PY

      - name: Run unit tests and build debug APK
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bounce-blade-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
