name: Kotlin Browser Edition
on:
  push:
    branches: [browser-kotlin]
    paths: ['browser/**', '.github/workflows/browser.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build Kotlin/JS browser game
        run: gradle -p browser :web:browserDevelopmentWebpack
      - name: Locate generated website
        run: |
          find browser/web/build -name index.html -o -name web.js
          test -f browser/web/build/dist/js/developmentExecutable/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: browser/web/build/dist/js/developmentExecutable
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
