name: Kotlin Browser Edition
on:
  push:
    branches: [browser-kotlin]
    paths: ['browser/**', '.github/workflows/browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build Kotlin/JS browser game
        run: gradle -p browser :web:jsBrowserDevelopmentWebpack --stacktrace
      - name: Inspect generated website
        run: |
          find browser/web/build -maxdepth 7 -type f | sort | tail -80
          test -f browser/web/build/dist/js/developmentExecutable/index.html
      - name: Upload browser edition
        uses: actions/upload-artifact@v4
        with:
          name: bounce-blade-kotlin-browser
          path: browser/web/build/dist/js/developmentExecutable
          if-no-files-found: error
          retention-days: 14
